services:
  mongodb:
    image: mongo:7
    container_name: comp3123-assignment1-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: comp3123_assignment1
    volumes:
      - assignment1_mongodb_data:/data/db

volumes:
  assignment1_mongodb_data:
